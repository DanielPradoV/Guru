<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru | Registro de vendedor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/Styles.css') }}">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <h1>Registro de vendedor</h1>
            <p class="subtitulo">
                Registra tu negocio para comenzar a vender en Guru
            </p>

            {% if mensaje %}
                <p role="status">{{ mensaje }}</p>
            {% endif %}

            <form action="{{ url_for('ventas.registro_vendedor') }}"
                  method="POST">

                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                    pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ0-9 .@_]+"
                    title="Solo se permiten letras, números, espacios y . @ _"
                    maxlength="100"
                    required
                >
                <small class="aviso">
                    Letras, números, espacios y los caracteres . @ _
                </small>

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="usuario@ejemplo.com"
                    maxlength="254"
                    required
                >

                <label for="negocio">Nombre del negocio</label>
                <input
                    type="text"
                    id="negocio"
                    name="negocio"
                    placeholder="Nombre de tu negocio"
                    pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ0-9 .@_]+"
                    title="Solo se permiten letras, números, espacios y . @ _"
                    maxlength="150"
                    required
                >

                <label for="nit">NIT</label>
                <input
                    type="text"
                    id="nit"
                    name="nit"
                    placeholder="Ej. 900123456-7"
                    inputmode="numeric"
                    pattern="[0-9]{9,10}(-[0-9])?"
                    title="Ingresa entre 9 y 10 dígitos, con dígito de verificación opcional separado por guion"
                    maxlength="12"
                    required
                >

                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    autocomplete="new-password"
                    pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ0-9 .@_]+"
                    required
                >

                <label for="confirmar">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">Registrar mi negocio</button>
            </form>

            <p class="registro">
                ¿Ya tienes una cuenta?
                <a href="{{ url_for('inicio') }}">Inicia sesión</a>
            </p>
        </section>
    </main>
</body>
</html>
