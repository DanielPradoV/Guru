
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru | Reenviar verificación</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/Styles.css') }}">
</head>

<body>
    <main class="login-container">
        <section class="login-card">

            <h1>Guru</h1>
            <h2>Reenviar verificación</h2>

            <p>
                Ingresa el correo electrónico con el que creaste tu cuenta.
            </p>

            {% if mensaje %}
                <p class="{{ 'mensaje-error' if tipo_mensaje == 'error' else 'mensaje-exito' }}">
                    {{ mensaje }}
                </p>
            {% endif %}

            <form method="POST"
                  action="{{ url_for('ventas.reenviar_verificacion') }}">

                <label for="correo">Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <button type="submit">
                    Reenviar correo
                </button>

            </form>

            <a href="{{ url_for('inicio') }}">
                Volver al inicio de sesión
            </a>

        </section>
    </main>
</body>
</html>
