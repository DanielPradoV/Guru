<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guru | Mi perfil</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/Styles.css') }}">
</head>
<body>
    <header>
        <h1>Guru</h1>
        <nav>
            <a href="{{ url_for('principal') }}">Mi cuenta</a>
            <a href="{{ url_for('cuenta.perfil') }}">Perfil</a>
            <a href="{{ url_for('cuenta.subidas') }}">Mis archivos</a>
        </nav>
    </header>
    <main class="login-container">
        <section class="login-card">
            <h1>Mi perfil</h1>
            <p class="subtitulo">
                Roles: {{ roles | join(', ') if roles else 'sin rol asignado' }}
                · Correo
                {% if datos.CorreoVerificado %}verificado{% else %}sin verificar{% endif %}
            </p>

            {% if mensaje %}
                <p role="status"
                   class="{{ 'mensaje-error' if tipo_mensaje == 'error' else 'mensaje-exito' }}">
                    {{ mensaje }}
                </p>
            {% endif %}

            <h2>Datos de la cuenta</h2>
            <form method="POST">
                <input type="hidden" name="formulario" value="datos">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre"
                       value="{{ datos.NombreCompleto }}" maxlength="100" required>
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo"
                       value="{{ datos.Correo }}" maxlength="254" required>
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" name="usuario"
                       value="{{ datos.Usuario }}" maxlength="50" required>
                <button type="submit">Guardar datos</button>
            </form>

            <h2>Cambiar contraseña</h2>
            <form method="POST">
                <input type="hidden" name="formulario" value="clave">
                <label for="clave_actual">Contraseña actual</label>
                <input type="password" id="clave_actual" name="clave_actual"
                       autocomplete="current-password" required>
                <label for="clave_nueva">Nueva contraseña</label>
                <input type="password" id="clave_nueva" name="clave_nueva"
                       placeholder="Mínimo 8 caracteres"
                       minlength="8" autocomplete="new-password" required>
                <label for="clave_confirmar">Confirmar nueva contraseña</label>
                <input type="password" id="clave_confirmar"
                       name="clave_confirmar" minlength="8"
                       autocomplete="new-password" required>
                <button type="submit">Cambiar contraseña</button>
            </form>
        </section>
    </main>
</body>
</html>
